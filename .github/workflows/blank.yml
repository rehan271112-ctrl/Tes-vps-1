name: Hanz-Aerohost VPS

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '⏱️ Durasi (jam, maks 720 = 30 hari)'
        required: true
        default: '24'
        type: choice
        options:
          - '1'
          - '6'
          - '12'
          - '24'
          - '48'
          - '72'
          - '168'
          - '336'
          - '720'
      password:
        description: '🔑 Password root (kosong = auto-generate)'
        required: false
        type: string
      cpu_cores:
        description: '💻 CPU Cores (1-4)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      ram_gb:
        description: '🧠 RAM (GB)'
        required: true
        default: '4'
        type: choice
        options:
          - '2'
          - '4'
          - '8'
          - '16'
      disk_gb:
        description: '💾 Disk (GB)'
        required: true
        default: '20'
        type: choice
        options:
          - '10'
          - '20'
          - '50'
          - '100'

jobs:
  ssh-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 43200

    steps:
      - name: Setup Server
        id: setup
        run: |
          # === REQUEST SPEK DARI INPUT ===
          REQ_CPU="${{ github.event.inputs.cpu_cores }}"
          REQ_RAM="${{ github.event.inputs.ram_gb }}"
          REQ_DISK="${{ github.event.inputs.disk_gb }}"
          TOTAL_HOURS="${{ github.event.inputs.duration }}"
          
          # === SET HOSTNAME ===
          sudo hostnamectl set-hostname Hanz-Aerohost
          sudo sed -i "s/127.0.1.1.*/127.0.1.1 Hanz-Aerohost/" /etc/hosts
          
          # === PASSWORD ===
          if [ -n "${{ github.event.inputs.password }}" ]; then
            ROOT_PASS="${{ github.event.inputs.password }}"
          else
            ROOT_PASS=$(openssl rand -base64 16 | tr -dc 'A-Za-z0-9' | head -c 16)
          fi
          
          # === INSTALL SSH ===
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server curl figlet toilet
          
          # === CONFIG SSH ===
          echo "root:${ROOT_PASS}" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/UsePAM yes/UsePAM no/' /etc/ssh/sshd_config
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd
          
          # === INSTALL CLOUDFLARED ===
          curl -sL "https://github.com/cloudflare/cloudflared/releases/download/2024.12.2/cloudflared-linux-amd64" \
            -o /tmp/cloudflared && chmod +x /tmp/cloudflared && sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          
          # === START TUNNEL ===
          cloudflared tunnel --url tcp://localhost:22 > /tmp/cf.log 2>&1 &
          sleep 8
          TUNNEL_HOST=$(grep -oE '[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          PUBLIC_IP=$(curl -s ifconfig.me)
          
          # === DETEKSI SPEK ASLI ===
          ACTUAL_CPU=$(nproc)
          ACTUAL_RAM=$(free -h | grep Mem | awk '{print $2}')
          ACTUAL_DISK=$(df -h / | awk 'NR==2 {print $2}')
          CPU_MODEL=$(lscpu | grep "Model name" | cut -d':' -f2 | xargs | cut -c1-30)
          
          # === BUAT BANNER SSH ===
          sudo bash -c 'cat > /etc/profile.d/hanz-banner.sh << "EOF"
#!/bin/bash
if [ "$TERM" != "linux" ] && [ -t 1 ]; then
  clear
  echo ""
  echo -e "\e[1;31m"
  echo "  ██╗  ██╗ █████╗ ███╗   ██╗███████╗     █████╗ ███████╗██████╗  ██████╗ ██╗  ██╗ ██████╗ ███████╗████████╗"
  echo "  ██║  ██║██╔══██╗████╗  ██║╚══███╔╝    ██╔══██╗██╔════╝██╔══██╗██╔═══██╗██║  ██║██╔═══██╗██╔════╝╚══██╔══╝"
  echo "  ███████║███████║██╔██╗ ██║  ███╔╝     ███████║█████╗  ██████╔╝██║   ██║███████║██║   ██║███████╗   ██║   "
  echo "  ██╔══██║██╔══██║██║╚██╗██║ ███╔╝      ██╔══██║██╔══╝  ██╔══██╗██║   ██║██╔══██║██║   ██║╚════██║   ██║   "
  echo "  ██║  ██║██║  ██║██║ ╚████║███████╗    ██║  ██║███████╗██║  ██║╚██████╔╝██║  ██║╚██████╔╝███████║   ██║   "
  echo "  ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝╚══════╝    ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═╝ ╚═════╝ ╚══════╝   ╚═╝   "
  echo -e "\e[0m"
  echo -e "\e[1;31m═══════════════════════════════════════════════════════════════════════════════════\e[0m"
  echo -e "\e[1;37m                              ✦ HANZ-AEROHOST PRESENTS ✦\e[0m"
  echo -e "\e[1;31m═══════════════════════════════════════════════════════════════════════════════════\e[0m"
  echo ""
  echo -e "\e[1;36m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\e[0m"
  echo -e "\e[1;33m                           📊 SERVER STATISTICS\e[0m"
  echo -e "\e[1;36m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\e[0m"
  echo ""
  IP=$(curl -s ifconfig.me 2>/dev/null || echo "N/A")
  CPU_MODEL=$(lscpu | grep "Model name" | cut -d":" -f2 | xargs | cut -c1-30 2>/dev/null || echo "Unknown")
  CPU_CORES=$(nproc 2>/dev/null || echo "?")
  TOTAL_RAM=$(free -h | grep Mem | awk "{print \$2}" 2>/dev/null || echo "N/A")
  USED_RAM=$(free -h | grep Mem | awk "{print \$3}" 2>/dev/null || echo "N/A")
  DISK=$(df -h / | awk "NR==2 {print \$2}" 2>/dev/null || echo "N/A")
  printf "\e[1;32m┌─────────────────────────────────────────────────────────────────────────────┐\e[0m\n"
  printf "\e[1;32m│\e[0m \e[1;37m🖥️  HOSTNAME     :\e[0m \e[1;32m%-50s\e[0m \e[1;32m│\e[0m\n" "Hanz-Aerohost"
  printf "\e[1;32m│\e[0m \e[1;37m🌐  IP VPS       :\e[0m \e[1;32m%-50s\e[0m \e[1;32m│\e[0m\n" "$IP"
  printf "\e[1;32m│\e[0m \e[1;37m🔌  PORT SSH     :\e[0m \e[1;32m%-50s\e[0m \e[1;32m│\e[0m\n" "22"
  printf "\e[1;32m│\e[0m \e[1;37m👤  USERNAME     :\e[0m \e[1;32m%-50s\e[0m \e[1;32m│\e[0m\n" "root"
  printf "\e[1;32m├─────────────────────────────────────────────────────────────────────────────┤\e[0m\n"
  printf "\e[1;32m│\e[0m \e[1;37m💻  CPU          :\e[0m \e[1;32m%-50s\e[0m \e[1;32m│\e[0m\n" "$CPU_MODEL ($CPU_CORES Core)"
  printf "\e[1;32m│\e[0m \e[1;37m🧠  RAM          :\e[0m \e[1;32m%-50s\e[0m \e[1;32m│\e[0m\n" "$USED_RAM / $TOTAL_RAM"
  printf "\e[1;32m│\e[0m \e[1;37m💾  DISK         :\e[0m \e[1;32m%-50s\e[0m \e[1;32m│\e[0m\n" "$DISK"
  printf "\e[1;32m└─────────────────────────────────────────────────────────────────────────────┘\e[0m\n"
  echo ""
  echo -e "\e[1;33m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\e[0m"
  echo -e "\e[1;32m  ✅ SELAMAT DATANG DI HANZ-AEROHOST VPS!\e[0m"
  echo -e "\e[1;33m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\e[0m"
  echo ""
fi
EOF'
          sudo chmod +x /etc/profile.d/hanz-banner.sh
          
          # === SAVE OUTPUT ===
          echo "root_pass=${ROOT_PASS}" >> $GITHUB_OUTPUT
          echo "tunnel_host=${TUNNEL_HOST}" >> $GITHUB_OUTPUT
          echo "public_ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT
          echo "actual_cpu=${ACTUAL_CPU}" >> $GITHUB_OUTPUT
          echo "actual_ram=${ACTUAL_RAM}" >> $GITHUB_OUTPUT
          echo "actual_disk=${ACTUAL_DISK}" >> $GITHUB_OUTPUT
          echo "cpu_model=${CPU_MODEL}" >> $GITHUB_OUTPUT

      - name: Tampilkan Info
        env:
          ROOT_PASS: ${{ steps.setup.outputs.root_pass }}
          TUNNEL_HOST: ${{ steps.setup.outputs.tunnel_host }}
          PUBLIC_IP: ${{ steps.setup.outputs.public_ip }}
          ACTUAL_CPU: ${{ steps.setup.outputs.actual_cpu }}
          ACTUAL_RAM: ${{ steps.setup.outputs.actual_ram }}
          ACTUAL_DISK: ${{ steps.setup.outputs.actual_disk }}
          CPU_MODEL: ${{ steps.setup.outputs.cpu_model }}
          REQ_CPU: ${{ github.event.inputs.cpu_cores }}
          REQ_RAM: ${{ github.event.inputs.ram_gb }}
          REQ_DISK: ${{ github.event.inputs.disk_gb }}
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════════════════╗"
          echo "║                         🚀 HANZ-AEROHOST VPS                              ║"
          echo "╠══════════════════════════════════════════════════════════════════════════════╣"
          echo "║  📌 HOSTNAME    : Hanz-Aerohost                                            ║"
          echo "║  🌐 IP PUBLIK   : $PUBLIC_IP                                              ║"
          echo "║  🔌 PORT SSH    : 22                                                       ║"
          echo "║  👤 USERNAME    : root                                                     ║"
          echo "║  🔑 PASSWORD    : $ROOT_PASS                                               ║"
          echo "╠══════════════════════════════════════════════════════════════════════════════╣"
          echo "║  📊 REQUESTED SPECS:                                                       ║"
          echo "║  💻 CPU Cores   : $REQ_CPU Core (Actual: $ACTUAL_CPU Core)                ║"
          echo "║  🧠 RAM         : $REQ_RAM GB (Actual: $ACTUAL_RAM)                       ║"
          echo "║  💾 Disk        : $REQ_DISK GB (Actual: $ACTUAL_DISK)                     ║"
          echo "╠══════════════════════════════════════════════════════════════════════════════╣"
          echo "║  🔗 TUNNEL      : $TUNNEL_HOST                                             ║"
          echo "║  ⏱️ DURASI      : $DURATION jam                                            ║"
          echo "╠══════════════════════════════════════════════════════════════════════════════╣"
          echo "║  ✅ SSH COMMAND:                                                            ║"
          echo "║  ssh -o ProxyCommand=\"cloudflared access tcp --hostname $TUNNEL_HOST\" root@$TUNNEL_HOST"
          echo "╚══════════════════════════════════════════════════════════════════════════════╝"
          echo ""

      - name: Keep Alive
        run: |
          HOURS=${{ github.event.inputs.duration }}
          SECONDS=$((HOURS * 3600))
          echo "⏱️ Server aktif $HOURS jam"
          sleep $SECONDS
