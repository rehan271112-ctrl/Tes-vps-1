name: Hanz-Aerohost

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durasi (jam)'
        required: true
        default: '24'
        type: choice
        options:
          - '1'
          - '6'
          - '12'
          - '24'
          - '48'
          - '72'
          - '168'
          - '336'
          - '720'

jobs:
  ssh-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 43200

    steps:
      - name: Setup SSH & Tunnel
        run: |
          # SET HOSTNAME
          sudo hostnamectl set-hostname Hanz-Aerohost
          
          # PASSWORD
          ROOT_PASS="rehan1270"
          
          # INSTALL SSH
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server curl
          
          # CONFIG SSH
          echo "root:${ROOT_PASS}" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd
          
          # INSTALL CLOUDFLARED
          curl -sL "https://github.com/cloudflare/cloudflared/releases/download/2024.12.2/cloudflared-linux-amd64" -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          
          # START TUNNEL
          cloudflared tunnel --url tcp://localhost:22 > /tmp/cf.log 2>&1 &
          sleep 8
          TUNNEL_HOST=$(grep -oE '[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          PUBLIC_IP=$(curl -s ifconfig.me)
          
          # TAMPILKAN INFO
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    🚀 HANZ-AEROHOST VPS                      ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          echo "║ Hostname    : Hanz-Aerohost                                   ║"
          echo "║ IP Publik   : $PUBLIC_IP                                     ║"
          echo "║ Tunnel      : $TUNNEL_HOST                                   ║"
          echo "║ User        : root                                           ║"
          echo "║ Password    : rehan1270                                      ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          echo "║ ssh -o ProxyCommand=\"cloudflared access tcp                 ║"
          echo "║      --hostname $TUNNEL_HOST\" root@$TUNNEL_HOST             ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          
          # SIMPAN KE GITHUB SUMMARY
          echo "# 🚀 HANZ-AEROHOST VPS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Hostname | Hanz-Aerohost |" >> $GITHUB_STEP_SUMMARY
          echo "| IP Publik | $PUBLIC_IP |" >> $GITHUB_STEP_SUMMARY
          echo "| Tunnel | $TUNNEL_HOST |" >> $GITHUB_STEP_SUMMARY
          echo "| User | root |" >> $GITHUB_STEP_SUMMARY
          echo "| Password | rehan1270 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## SSH Command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "ssh -o ProxyCommand=\"cloudflared access tcp --hostname $TUNNEL_HOST\" root@$TUNNEL_HOST" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Keep Alive
        run: |
          HOURS=${{ inputs.duration }}
          SECONDS=$((HOURS * 3600))
          echo "⏱️ Server aktif $HOURS jam"
          sleep $SECONDS
